openapi: 3.0.3
info:
  title: Job Agent API
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /api/v1/companies:
    get:
      summary: List companies
      parameters:
        - in: query
          name: after
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Up to 100 records ordered by ID
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Company' }
    post:
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Company' }
      responses:
        '201': { description: Company created, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '400': { description: Invalid input }
        '401': { description: Unauthorized }
        '409': { description: Domain already exists }
  /api/v1/companies/import:
    post:
      summary: Atomically import company seeds
      parameters:
        - in: query
          name: format
          required: true
          schema: { type: string, enum: [csv, yaml] }
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string } }
          application/yaml: { schema: { type: string } }
      responses:
        '201': { description: Import completed }
        '400': { description: Invalid input }
        '401': { description: Unauthorized }
        '409': { description: Duplicate domain or seed }
  /api/v1/companies/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      summary: Read a company
      responses:
        '200': { description: Company, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '404': { description: Company not found }
    put:
      summary: Update a company
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Company' }
      responses:
        '204': { description: Company updated }
        '404': { description: Company not found }
        '409': { description: Domain already exists }
    delete:
      summary: Delete a company without dependent seeds or boards
      responses:
        '204': { description: Company deleted }
        '404': { description: Company not found }
        '409': { description: Company has dependent records }
  /api/v1/seeds:
    get:
      summary: List seeds
      parameters:
        - in: query
          name: after
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Up to 100 records ordered by ID
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Seed' }
    post:
      summary: Create a company seed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Seed' }
      responses:
        '201': { description: Seed created, content: { application/json: { schema: { $ref: '#/components/schemas/Seed' } } } }
        '409': { description: Company or seed conflict }
  /api/v1/seeds/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      summary: Read a seed
      responses:
        '200': { description: Seed, content: { application/json: { schema: { $ref: '#/components/schemas/Seed' } } } }
        '404': { description: Seed not found }
    put:
      summary: Update a seed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Seed' }
      responses:
        '204': { description: Seed updated }
        '404': { description: Seed not found }
        '409': { description: Company or seed conflict }
    delete:
      summary: Delete a seed
      responses:
        '204': { description: Seed deleted }
        '404': { description: Seed not found }
  /api/v1/boards:
    get:
      summary: List boards
      parameters:
        - in: query
          name: after
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Up to 100 records ordered by ID
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Board' }
    post:
      summary: Create a board
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Board' }
      responses:
        '201': { description: Board created, content: { application/json: { schema: { $ref: '#/components/schemas/Board' } } } }
        '409': { description: Company or board conflict }
  /api/v1/boards/{id}/validate:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      summary: Validate a board under source policy
      responses:
        '200':
          description: Provider board verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '403': { description: Source policy denies validation }
        '404': { description: Board not found }
  /api/v1/boards/{id}/metadata:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      summary: Replace observed board metadata and separate operator overrides
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoardMetadata' }
      responses:
        '204': { description: Metadata updated }
        '400': { description: Invalid metadata }
        '404': { description: Board not found }
  /api/v1/boards/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      summary: Read a board
      responses:
        '200': { description: Board, content: { application/json: { schema: { $ref: '#/components/schemas/Board' } } } }
        '404': { description: Board not found }
    put:
      summary: Update a board
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Board' }
      responses:
        '204': { description: Board updated }
        '404': { description: Board not found }
        '409': { description: Company or board conflict }
    delete:
      summary: Delete a board
      responses:
        '204': { description: Board deleted }
        '404': { description: Board not found }
  /api/v1/tiers/companies:
    get:
      summary: List company tiers
      responses:
        '200': { description: Company tier definitions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tier' } } } } }
    put:
      summary: Create or update a company tier using its current version
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Tier' } }
      responses:
        '200': { description: Saved tier and new version, content: { application/json: { schema: { $ref: '#/components/schemas/Tier' } } } }
        '409': { description: Stale version or conflict }
  /api/v1/tiers/roles:
    get:
      summary: List role tiers
      responses:
        '200': { description: Role tier definitions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tier' } } } } }
    put:
      summary: Create or update a role tier using its current version
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Tier' } }
      responses:
        '200': { description: Saved tier and new version, content: { application/json: { schema: { $ref: '#/components/schemas/Tier' } } } }
        '409': { description: Stale version or conflict }
  /api/v1/tiers/{axis}/{tier}/history:
    get:
      summary: Read immutable tier definition history
      parameters:
        - in: path
          name: axis
          required: true
          schema: { type: string, enum: [company, role] }
        - in: path
          name: tier
          required: true
          schema: { type: string }
      responses:
        '200': { description: Version history, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tier' } } } } }
  /api/v1/role-families:
    get:
      summary: List role families
      parameters:
        - in: query
          name: after
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200': { description: Role families, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoleFamily' } } } } }
    post:
      summary: Create an UNASSIGNED role family
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RoleFamily' } }
      responses:
        '201': { description: Created role family, content: { application/json: { schema: { $ref: '#/components/schemas/RoleFamily' } } } }
  /api/v1/role-families/{id}:
    put:
      parameters: [{ $ref: '#/components/parameters/ID' }]
      summary: Update a role family without changing its tier
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RoleFamily' } }
      responses:
        '204': { description: Role family updated }
        '404': { description: Role family not found }
  /api/v1/companies/{id}/tier:
    post:
      parameters: [{ $ref: '#/components/parameters/ID' }]
      summary: Assign a company tier and append assignment history
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/TierAssignmentInput' } }
      responses:
        '204': { description: Tier assigned }
        '404': { description: Company not found }
  /api/v1/role-families/{id}/tier:
    post:
      parameters: [{ $ref: '#/components/parameters/ID' }]
      summary: Assign a role tier and append assignment history
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/TierAssignmentInput' } }
      responses:
        '204': { description: Tier assigned }
        '404': { description: Role family not found }
  /api/v1/tier-assignments:
    get:
      summary: Read assignment history for a company or role family
      parameters:
        - in: query
          name: axis
          required: true
          schema: { type: string, enum: [company, role] }
        - in: query
          name: target_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: after
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200': { description: Assignment history, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TierAssignment' } } } } }
  /api/v1/policies/global:
    get:
      summary: Read the global emergency-stop state
      responses:
        '200': { description: Current global policy, content: { application/json: { schema: { $ref: '#/components/schemas/GlobalPolicy' } } } }
    put:
      summary: Set the global emergency-stop state as a new policy version
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GlobalPolicyInput' } }
      responses:
        '200': { description: New policy version }
  /api/v1/policies/steps:
    get:
      summary: Read default and tier-specific step modes
      responses:
        '200': { description: Step policy rules, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StepPolicy' } } } } }
    put:
      summary: Set one step mode as a new policy version
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/StepPolicyInput' } }
      responses:
        '200': { description: New policy version }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ID:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  schemas:
    Company:
      type: object
      required: [name, domain]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        name: { type: string }
        domain: { type: string }
        tier_id: { type: string, readOnly: true }
    Seed:
      type: object
      required: [company_id, url]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        company_id: { type: integer, format: int64 }
        url: { type: string }
    Board:
      type: object
      required: [company_id, provider, board_key]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        company_id: { type: integer, format: int64 }
        provider: { type: string }
        region: { type: string }
        board_key: { type: string }
        metadata: { allOf: [{ $ref: '#/components/schemas/BoardMetadata' }], readOnly: true }
    BoardMetadata:
      type: object
      required: [state, capabilities, provenance, operator_override]
      properties:
        state:
          type: string
          enum: [candidate, verified, degraded, inactive, blocked_by_policy, manual_review]
        capabilities: { type: object }
        provenance: { type: object }
        last_verified_at: { type: string, format: date-time, nullable: true }
        operator_override: { type: object }
    ValidationResult:
      type: object
      required: [provider]
      properties:
        provider: { type: string }
        listed: { type: integer, minimum: 0 }
        unlisted: { type: integer, minimum: 0 }
        unknown: { type: integer, minimum: 0 }
    Tier:
      type: object
      required: [id, name, enabled, priority, settings]
      properties:
        id: { type: string, pattern: '^[A-Z][A-Z0-9_-]{0,63}$' }
        axis: { type: string, enum: [company, role] }
        name: { type: string, minLength: 1 }
        enabled: { type: boolean }
        priority: { type: integer }
        settings: { type: object }
        version: { type: integer, format: int64, minimum: 0, description: '0 creates; updates require the current version.' }
    RoleFamily:
      type: object
      required: [name, criteria]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        name: { type: string, minLength: 1 }
        criteria: { type: object }
        tier_id: { type: string, readOnly: true }
    TierAssignmentInput:
      type: object
      required: [tier_id, reason]
      properties:
        tier_id: { type: string }
        reason: { type: string, minLength: 1, maxLength: 512 }
    TierAssignment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        axis: { type: string, enum: [company, role] }
        target_id: { type: integer, format: int64 }
        tier_id: { type: string }
        tier_version: { type: integer, format: int64 }
        actor: { type: string }
        reason: { type: string }
        created_at: { type: string }
    GlobalPolicy:
      type: object
      required: [version, enabled]
      properties:
        version: { type: integer, format: int64 }
        enabled: { type: boolean }
    GlobalPolicyInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    StepPolicy:
      type: object
      properties:
        policy_version: { type: integer, format: int64 }
        step_key: { type: string }
        axis: { type: string }
        tier_id: { type: string }
        mode: { type: string, enum: [LIVE, AUDIT, OFF] }
    StepPolicyInput:
      type: object
      required: [step_key, mode]
      properties:
        step_key: { type: string }
        axis: { type: string, enum: [company, role] }
        tier_id: { type: string }
        mode: { type: string, enum: [LIVE, AUDIT, OFF] }
