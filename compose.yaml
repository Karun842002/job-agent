services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent-local
      POSTGRES_DB: jobagent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent -d jobagent"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://jobagent:jobagent-local@postgres:5432/jobagent?sslmode=disable"]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:16686:16686"
  otel-collector:
    build:
      context: .
      dockerfile: deploy/otel/Dockerfile
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/collector.yaml"]
    environment:
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:-http://host.docker.internal:4319/v1/traces}
      LANGFUSE_OTLP_AUTHORIZATION: ${LANGFUSE_OTLP_AUTHORIZATION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol-contrib/collector.yaml:ro
    depends_on:
      - jaeger
volumes:
  postgres-data:
