receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  filter/unsafe_links:
    error_mode: propagate
    traces:
      span:
        - 'Len(links) > 0'
  filter/events:
    error_mode: propagate
    traces:
      spanevent:
        - 'true'
  filter/genai:
    error_mode: propagate
    traces:
      span:
        - 'attributes["gen_ai.operation.name"] == nil'
  transform/operations:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, [])
          - set(attributes["service.name"], "job-agent")
      - context: span
        statements:
          - keep_keys(attributes, [])
          - set(name, "operation")
          - set(status.message, "")
          - set(trace_state, "")
          - set(instrumentation_scope.name, "job-agent")
          - set(instrumentation_scope.version, "")
          - keep_keys(instrumentation_scope.attributes, [])
  transform/redact:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, [])
          - set(attributes["service.name"], "job-agent")
      - context: span
        statements:
          - keep_keys(attributes, ["gen_ai.operation.name", "gen_ai.request.model", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens"])
          - set(name, "gen_ai.generation")
          - set(status.message, "")
          - set(trace_state, "")
          - set(instrumentation_scope.name, "job-agent")
          - set(instrumentation_scope.version, "")
          - keep_keys(instrumentation_scope.attributes, [])
  batch:

exporters:
  otlp/operations:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlphttp/langfuse:
    # Synthetic local capture only; remote export remains gated by ADR-0007.
    traces_endpoint: http://host.docker.internal:4319/v1/traces

service:
  pipelines:
    traces/operations:
      receivers: [otlp]
      processors: [memory_limiter, filter/unsafe_links, filter/events, transform/operations, batch]
      exporters: [otlp/operations]
    traces/genai:
      receivers: [otlp]
      processors: [memory_limiter, filter/unsafe_links, filter/events, filter/genai, transform/redact, batch]
      exporters: [otlphttp/langfuse]
